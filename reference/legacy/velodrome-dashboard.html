<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velodrome – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--baby:#F4C2D0;--deep:#8C3150;--rose:#AF4769;--silver:#B5B1B5;--char:#1C1C1E;--px:clamp(1rem,2.4vw,2.5rem);
  --bg:#F3F3F4;--text:#1C1C1E;--muted:#6b656d;--line:rgba(28,28,30,.09);--chip:rgba(28,28,30,.06);
  --g1:rgba(255,255,255,.74);--g2:rgba(255,255,255,.4);--edge:rgba(255,255,255,.75);--hi:rgba(255,255,255,.95);
  --glow:rgba(244,194,208,.95);--glow2:rgba(175,71,105,.3);--shell:rgba(255,255,255,.4);--pop:rgba(255,255,255,.88);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1C1E;--text:#fff;--muted:#B5B1B5;--line:rgba(255,255,255,.11);--chip:rgba(255,255,255,.09);--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.05);--edge:rgba(255,255,255,.2);--hi:rgba(255,255,255,.3);--glow:rgba(140,49,80,.8);--glow2:rgba(175,71,105,.35);--shell:rgba(255,255,255,.04);--pop:rgba(40,32,36,.9);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1C1E;--text:#fff;--muted:#B5B1B5;--line:rgba(255,255,255,.11);--chip:rgba(255,255,255,.09);--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.05);--edge:rgba(255,255,255,.2);--hi:rgba(255,255,255,.3);--glow:rgba(140,49,80,.8);--glow2:rgba(175,71,105,.35);--shell:rgba(255,255,255,.04);--pop:rgba(40,32,36,.9);color-scheme:dark}
html{height:100%;font-size:clamp(15px,.5vw + 8.8px,22px);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(45rem 32rem at 10% 100%,var(--glow),transparent 70%),radial-gradient(38rem 32rem at 95% 40%,var(--glow2),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit;transition:transform .15s,background-color .2s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
[hidden]{display:none!important}
.glass{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);
 box-shadow:inset 0 1.5px 1px var(--hi),inset 0 -.6rem 1.5rem rgba(244,194,208,.22),0 1.1rem 2.5rem -1.1rem rgba(140,49,80,.45)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.7;background:radial-gradient(120% 70% at 15% -10%,rgba(255,255,255,.55),transparent 55%),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%)}
.glass>*{position:relative}
.hg{background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));color:#fff;backdrop-filter:blur(18px) saturate(190%);-webkit-backdrop-filter:blur(18px) saturate(190%);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -.4rem .9rem rgba(140,49,80,.25),0 .5rem 1.2rem -.6rem rgba(28,28,30,.5)}
.shell{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--shell)}
/* hero */
.hero{position:relative;flex:none;padding:1.25rem max(var(--px),env(safe-area-inset-right)) 0 max(var(--px),env(safe-area-inset-left));color:#fff;display:flex;flex-direction:column;gap:1.1rem;overflow:hidden;background:linear-gradient(100deg,#5a1d33,var(--deep) 45%,var(--rose))}
.stripes{position:absolute;inset:-10px;pointer-events:none;filter:blur(2.5px);background:radial-gradient(60% 90% at 62% 40%,rgba(244,194,208,.95),transparent 70%),repeating-linear-gradient(90deg,rgba(28,28,30,.55) 0 5px,transparent 5px 13px,rgba(140,49,80,.6) 13px 16px,transparent 16px 27px),repeating-linear-gradient(90deg,rgba(244,194,208,.35) 0 3px,transparent 3px 19px);background-size:100% 100%,200% 100%,160% 100%;animation:drift 40s linear infinite alternate}
@keyframes drift{to{background-position:0 0,-60px 0,50px 0}}
.nm .stripes{animation:none}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(28,28,30,.45),transparent 55%)}
.hero>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.date{font-size:.8rem;opacity:.85;margin-bottom:.5rem}
h1{font-size:clamp(1.8rem,3.2vw,2.7rem);font-weight:500;line-height:1.05;letter-spacing:-.02em}
h1 em{display:block;font-weight:600;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.pill{display:inline-flex;gap:.4rem;padding:.3rem .7rem;border-radius:99px;font-size:.76rem}
.icons{display:flex;gap:.5rem;align-items:center;flex:none}
.ib{position:relative;width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center}
.ib svg{width:1rem;height:1rem;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib.dot::after{content:"";position:absolute;top:.45rem;right:.5rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--baby);box-shadow:0 0 0 2px var(--deep)}
.av{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:600;font-size:.9rem;background:linear-gradient(135deg,var(--baby),var(--rose));color:var(--char);text-align:center}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:.75rem;flex-wrap:wrap}
.tabs{display:flex;gap:.15rem;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.6rem .95rem;font-size:.82rem;color:rgba(255,255,255,.82);border-radius:.8rem .8rem 0 0;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ctrls{display:flex;gap:.5rem;padding-bottom:.8rem;align-items:center;flex-wrap:wrap}
.sel{padding:.55rem .9rem;border-radius:99px;font-size:.82rem;display:inline-flex;gap:.5rem;align-items:center;white-space:nowrap}
.sel svg{width:.6rem;height:.6rem;fill:#fff}
.qi{width:0;opacity:0;padding:.55rem 0;border:0;border-radius:99px;font:inherit;font-size:.82rem;color:var(--char);background:rgba(255,255,255,.92);transition:width .25s,opacity .25s,padding .25s}
.qi.open{width:min(14rem,100%);opacity:1;padding:.55rem .9rem}
.search{padding:.62rem 1.1rem;border-radius:99px;font-size:.82rem;font-weight:500;color:var(--char);display:inline-flex;gap:.5rem;align-items:center;background:linear-gradient(180deg,#fff,rgba(255,255,255,.75));box-shadow:inset 0 1px 1px #fff,0 .5rem 1.2rem -.5rem rgba(28,28,30,.6)}
.search svg{width:.9rem;height:.9rem;stroke:var(--char);fill:none;stroke-width:2;stroke-linecap:round}
/* main */
.main{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--rose) transparent;padding:1.1rem max(var(--px),env(safe-area-inset-right)) 1.8rem max(var(--px),env(safe-area-inset-left));display:grid;gap:1rem;align-content:start;
 background:radial-gradient(30rem 20rem at 8% 30%,var(--glow),transparent 70%),radial-gradient(30rem 20rem at 55% 5%,var(--glow2),transparent 70%),radial-gradient(30rem 25rem at 100% 60%,var(--glow),transparent 70%)}
.cards,.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1rem}
.card{container-type:inline-size;display:flex;flex-direction:column;border-radius:1.6rem;padding:1.25rem;min-height:16rem}
.ch{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-bottom:1.2rem}
.ch>span{display:inline-flex;align-items:center;gap:.5rem}
.ch svg.i{width:1.65rem;height:1.65rem;padding:.4rem;border-radius:50%;background:var(--chip);stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ch b{font-weight:500;color:var(--text)}
.big{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem .6rem;font-size:2.3rem;font-size:clamp(1.7rem,9cqi,2.9rem);font-weight:500;letter-spacing:-.03em;line-height:1.1}
.chip{font-size:.7rem;font-weight:500;letter-spacing:0;padding:.2rem .5rem;border-radius:99px;background:var(--chip)}
.sun{margin-left:auto;width:1.6rem;height:1.6rem;stroke:var(--rose);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.sub{font-size:.76rem;color:var(--muted);margin:.5rem 0 1.1rem}.sub b{color:var(--text);font-weight:500}
.prog{height:1.25rem;border-radius:.35rem;background:var(--chip);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.f1{background:linear-gradient(90deg,var(--deep),var(--rose));box-shadow:inset 0 2px 2px rgba(255,255,255,.4)}
.f2{width:13%;background:repeating-linear-gradient(135deg,var(--silver) 0 2px,transparent 2px 5px)}
.ticks{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);margin-top:.3rem;border-top:1px solid var(--line);padding-top:.3rem}
.mark,.tipw{position:relative;height:2.3rem}
.tip{position:absolute;top:.2rem;transform:translateX(-50%);padding:.35rem .65rem;border-radius:99px;font-size:.82rem;font-weight:500;display:inline-flex;gap:.45rem;align-items:center;white-space:nowrap}
.tip em{font-style:normal;font-size:.62rem;color:#fff;padding:.1rem .45rem;border-radius:99px;background:linear-gradient(180deg,var(--rose),var(--deep))}
.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.8rem 1rem;margin-top:auto;padding-top:1.1rem;font-size:.72rem;color:var(--muted)}
.stats b,.ins b{display:block;color:var(--text);font-size:1rem;font-weight:500;margin-top:.2rem;white-space:nowrap}
.mini{display:inline-block;width:1.4rem;height:.32rem;border-radius:9px;background:var(--chip);vertical-align:middle;margin-left:.4rem;overflow:hidden}
.mini i{display:block;height:100%;background:var(--rose)}
.lc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.5rem;margin-top:auto}
.yl{display:flex;flex-direction:column;justify-content:space-between;padding:2.3rem 0 1.05rem;font-size:.62rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.xs{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);margin-top:.3rem}
.avg{display:flex;justify-content:space-between;font-size:.95rem;font-weight:500;margin-bottom:.4rem}
.ur{display:flex;justify-content:space-between;align-items:flex-end;gap:.8rem}
.bars{display:flex;align-items:flex-end;gap:.3rem;height:4.4rem;flex:1;min-width:5rem;max-width:9.5rem}
.bars i{flex:1;border-radius:.6rem;background:var(--chip);box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.bars i.on{background:linear-gradient(180deg,var(--baby),var(--rose) 55%,var(--deep))}
.nu{font-size:.72rem;color:var(--muted);margin-top:.4rem}.nu b{color:var(--text);font-weight:500}
.ins{margin-top:auto;padding:.8rem;border-radius:1rem;background:var(--chip);font-size:.72rem;color:var(--muted)}
.ins>div{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem 1rem;margin-bottom:.7rem}.ins b{font-size:.85rem;margin-top:.1rem}
.ins a{color:var(--rose);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@container (max-width:19rem){.ur{flex-direction:column;align-items:stretch}.bars{max-width:none}.ch>span:last-child{margin-left:auto}}
/* tables */
.tbl{border-radius:1.6rem;padding:1.1rem 1.25rem .8rem}
.th{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-bottom:.8rem;flex-wrap:wrap}
.th h2{font-size:1.2rem;font-weight:500;letter-spacing:-.01em}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{padding:.5rem .9rem;border-radius:99px;font-size:.76rem;font-weight:500;display:inline-flex;gap:.4rem;align-items:center;background:var(--chip);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 0 0 1px var(--line)}
.btn.dark{background:linear-gradient(180deg,#3a3a3d,var(--char));color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 .5rem 1.1rem -.5rem rgba(28,28,30,.7)}
.btn.rose{background:linear-gradient(180deg,var(--rose),var(--deep));color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.scroll{overflow-x:auto;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:44rem}
th{font-weight:400;color:var(--muted);padding:.6rem .75rem;background:var(--chip);text-align:left;white-space:nowrap}
th:first-child{border-radius:.8rem 0 0 .8rem}th:last-child{border-radius:0 .8rem .8rem 0}
th button:hover{color:var(--text)}
td{padding:.85rem .75rem;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp td{padding:.45rem .75rem}
tr:last-child td{border-bottom:0}
td.emp{text-align:center;color:var(--muted);padding:2rem 1rem;white-space:normal}
.st{padding:.2rem .6rem;border-radius:99px;font-size:.7rem;background:rgba(244,194,208,.5);color:var(--deep)}
.st.ok{background:rgba(175,71,105,.16);color:var(--rose)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st{color:var(--baby)}:root:not([data-theme="light"]) .st.ok{color:#f0a3ba}}
:root[data-theme="dark"] .st{color:var(--baby)}:root[data-theme="dark"] .st.ok{color:#f0a3ba}
.pf{display:inline-flex;align-items:center;gap:.4rem}.pf i{width:.5rem;height:.5rem;border-radius:2px;background:var(--rose)}
.kpi{container-type:inline-size;border-radius:1.4rem;padding:1.1rem 1.25rem}.kpi p{font-size:.78rem;color:var(--muted)}.kpi b{display:block;font-size:1.8rem;font-size:clamp(1.4rem,11cqi,2.4rem);font-weight:500;letter-spacing:-.02em;margin-top:.4rem}
.cols{display:flex;align-items:flex-end;gap:.5rem;height:14rem;margin-top:.6rem}
.cols div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.4rem;font-size:.62rem;color:var(--muted)}
.cols i{width:100%;min-height:.4rem;border-radius:.6rem;background:linear-gradient(180deg,var(--baby),var(--rose) 60%,var(--deep));box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.hb{margin-bottom:1rem;font-size:.78rem}.hb div:first-child{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.hb .prog{height:.6rem;border-radius:99px}.hb .f1{border-radius:99px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:1rem}
.rep{border-radius:1.4rem;padding:1.2rem;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start;min-height:9.5rem}
.rep h3{font-size:1rem;font-weight:500}.rep p{font-size:.78rem;color:var(--muted);flex:1;margin-bottom:.5rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.8rem 1rem;flex-wrap:wrap;padding:1rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.row>:first-child{flex:1 1 12rem}.row:last-child{border:0}.row small{display:block;color:var(--muted);font-size:.76rem;margin-top:.15rem}
.row input,.md input,.md select{font:inherit;font-size:.82rem;padding:.55rem .75rem;border-radius:.8rem;border:1px solid var(--line);background:var(--chip);color:var(--text);width:100%}
.row input{width:min(14rem,100%)}
.seg{display:flex;flex-wrap:wrap;gap:.2rem;padding:.2rem;border-radius:1.2rem;background:var(--chip)}
.seg button{padding:.4rem .8rem;border-radius:99px;font-size:.76rem}
.seg .on{background:linear-gradient(180deg,var(--rose),var(--deep));color:#fff}
.sw{width:2.6rem;height:1.5rem;border-radius:99px;background:var(--chip);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--rose)}.sw.on::after{transform:translateX(1.1rem)}
/* overlays */
.pop{position:fixed;z-index:50;min-width:13rem;max-width:min(19rem,92vw);max-height:70dvh;overflow:auto;padding:.5rem;border-radius:1.2rem;background:var(--pop);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 1px var(--hi),0 1.5rem 3rem -1rem rgba(28,28,30,.55)}
.mi{display:flex;justify-content:space-between;gap:.8rem;width:100%;padding:.55rem .75rem;border-radius:.8rem;font-size:.82rem}
.mi:hover{background:var(--chip)}.mi span{color:var(--rose)}
.pt{padding:.4rem .75rem;font-size:.7rem;color:var(--muted)}
.nt{padding:.5rem .75rem;font-size:.76rem;border-radius:.8rem}
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;background:rgba(28,28,30,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.md{width:min(32rem,100%);max-height:90dvh;overflow:auto;border-radius:1.6rem;padding:1.4rem;background:var(--pop);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--edge);box-shadow:inset 0 1px 1px var(--hi),0 2rem 4rem -1.2rem rgba(0,0,0,.6);display:grid;gap:.8rem}
.md h3{font-size:1.1rem;font-weight:500}.md label{display:grid;gap:.3rem;font-size:.76rem;color:var(--muted)}
.md textarea{width:100%;font:.74rem/1.5 ui-monospace,Menlo,Consolas,monospace;padding:.75rem;border-radius:.9rem;border:1px solid var(--line);background:var(--chip);color:var(--text);resize:none}
.mb{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);opacity:0;pointer-events:none;z-index:70;max-width:90vw;padding:.6rem 1.1rem;border-radius:99px;font-size:.82rem;background:var(--char);color:#fff;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* responsive */
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cards>:last-child{grid-column:span 2}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1040px){.ctrls{order:-1;width:100%;padding-bottom:0}.search{margin-left:auto}}
@media (max-width:700px),(max-height:620px){html,body{height:auto}.shell{height:auto;overflow:visible}.main{overflow:visible}}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}.cards>:last-child{grid-column:auto}.card{min-height:0}.top{flex-direction:column-reverse}.icons{align-self:flex-end}}
@media (max-width:560px){.g3{grid-template-columns:minmax(0,1fr)}.cols{gap:.25rem}.cols div:nth-child(even) span{visibility:hidden}.th{align-items:flex-start}}
@media (max-width:640px){
 table,tbody,tr,td{display:block;min-width:0;width:100%}
 thead{display:none}
 tr{padding:.5rem 0;border-bottom:1px solid var(--line)}tr:last-child{border:0}
 td{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.35rem .2rem;border:0;white-space:normal;text-align:right}
 td::before{content:attr(data-l);color:var(--muted);text-align:left;flex:none}
 td.emp{display:block}td.emp::before{content:none}
 .cmp td{padding:.25rem .2rem}
}
@media (prefers-reduced-motion:reduce){.stripes{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="hero">
    <div class="stripes"></div>
    <div class="top">
      <div>
        <div class="date" id="date"></div>
        <h1><span id="greet"></span><em id="nm"></em></h1>
        <div class="pills"><span class="pill hg"><b>Stable</b><span id="p1"></span></span><span class="pill hg"><b>Growing</b><span id="p2"></span></span></div>
      </div>

    CU.unshift([nm,$('#cp').value,+$('#cm').value||0,'Active',S.plat==='All'?'Shopify':S.plat,new Date().toISOString().slice(0,10)]);save();closeM();render();toast('Customer added')}
  else if(a==='close')closeM();
  else if(a==='copy'){var ta=$('#ta');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('CSV copied')},fb)}catch(x){fb()}}
  else if(a==='read'){S.unread=0;render();toast('All caught up')}
  else if(a==='theme'){var d=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=d?'light':'dark';save();render()}
  else if(a==='reset'){S.name='Velodrome';S.cur='$';S.cmp=0;S.nm=0;S.theme='auto';S.season='2025 Season';S.plat='All';S.stat='All';S.sort={};save();render();toast('Defaults restored')}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeP();closeM()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('a[data-act]')){e.preventDefault();e.target.click()}
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;render()});
document.addEventListener('change',function(e){if(e.target.id==='sn'){S.name=e.target.value.trim()||'Velodrome';save();head();toast('Name updated')}});
$('#main').addEventListener('scroll',closeP,{passive:true});
addEventListener('scroll',closeP,{passive:true});
addEventListener('resize',closeP);
render();
})();
</script>
</body>
</html>
